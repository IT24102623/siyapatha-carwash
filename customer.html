<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Siyapatha – Download Ticket</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f2fa;color:#26103e;font:16px system-ui,Arial}header{background:linear-gradient(110deg,#370668,#0b75b4);color:#fff;padding:24px 15px;text-align:center}header img{height:76px;max-width:120px;object-fit:contain}h1{margin:4px;font-size:1.6rem}main{max-width:520px;margin:24px auto;padding:0 14px}.card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 4px 20px #22114416;text-align:center}button{background:#51208f;color:white;border:0;border-radius:10px;padding:14px 22px;font-size:1rem;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}p{line-height:1.5}.small{color:#655b74;font-size:.9rem}.error{color:#a71937}#preview{width:100%;margin:12px auto;border:1px solid #ddd;border-radius:8px}#ticket{display:none}</style></head><body><header><img src="siyapatha-logo.png" alt="Siyapatha logo"><h1>Siyapatha · Wash & Wish</h1><div>21 November 2026 · Rs. 1,000</div></header><main><div class="card"><h2>Your car wash ticket</h2><p id="status">Pay Rs. 1,000 to the Siyapatha team, then tap below to request your ticket.</p><button id="request">Request my ticket</button><div id="ticket"><h2 id="number"></h2><img id="preview" alt="Your numbered ticket"><p><button id="download">Download my ticket</button></p></div><p class="small">Keep this page open while waiting for the admin to approve your payment. Do not request more than once.</p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const SUPABASE_URL='https://bzchztgshfctrjodycfm.supabase.co';
const KEY='sb_publishable_A9hhivsQW5nnAJdwl5Gm3g_fD8vyBTl';
const db=window.supabase.createClient(SUPABASE_URL,KEY);
const $=id=>document.getElementById(id);
let current=null,downloadUrl=null,polling=false;
const storageKey='siyapatha-customer-request';
function status(t,err=false){$('status').textContent=t;$('status').className=err?'error':''}
function remember(){try{localStorage.setItem(storageKey,JSON.stringify(current))}catch(e){}}
function load(){try{const v=JSON.parse(localStorage.getItem(storageKey)||'null');if(v?.id&&v?.token)current=v}catch(e){}}
async function requestTicket(){if(current)return check();$('request').disabled=true;status('Sending request…');const {data,error}=await db.rpc('create_siyapatha_request');if(error){status(error.message,true);$('request').disabled=false;return}const r=data?.[0];if(!r){status('Could not create request.',true);$('request').disabled=false;return}current={id:r.request_id,token:r.request_token};remember();$('request').style.display='none';status('Waiting for admin approval after payment…');await check()}
async function check(){if(!current||polling)return;polling=true;try{const {data,error}=await db.rpc('get_siyapatha_request',{p_request_id:current.id,p_token:current.token});if(error)throw error;const r=data?.[0];if(!r){status('Request not found. Please ask the admin.',true);return}if(r.request_state==='waiting'){status('Waiting for admin approval after payment…')}else if(r.request_state==='rejected'){status('Request declined. Please speak to the Siyapatha team.',true);$('request').style.display='none'}else if(r.request_state==='approved'){status('Payment confirmed! Download your ticket below.');$('request').style.display='none';if(!$('ticket').dataset.number){await showTicket(r.issued_number)}}}catch(e){status(e.message,true)}finally{polling=false}}
const base=new Image();base.src='ticket.jpg';
async function showTicket(number){await base.decode();const c=document.createElement('canvas');c.width=base.naturalWidth;c.height=base.naturalHeight;const ctx=c.getContext('2d');ctx.drawImage(base,0,0);ctx.fillStyle='#2b0758';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold 52px Arial,sans-serif';ctx.fillText(number,1480,59,175);const blob=await new Promise(resolve=>c.toBlob(resolve,'image/png'));downloadUrl=URL.createObjectURL(blob);$('preview').src=downloadUrl;$('number').textContent='Ticket '+number;$('ticket').dataset.number=number;$('ticket').style.display='block';$('download').onclick=()=>{const a=document.createElement('a');a.href=downloadUrl;a.download='Siyapatha-'+number+'.png';a.click()}}
$('request').onclick=requestTicket;load();if(current){$('request').style.display='none';check()}setInterval(check,4000);
</script></body></html>
